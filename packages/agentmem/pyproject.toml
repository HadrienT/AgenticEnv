[project]
name = "agentmem"
version = "0.1.0"
description = "Episodic + procedural agent memory (experience, not knowledge), PostgreSQL+pgvector."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmem"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
