[project]
name = "kbase-mcp"
version = "0.1.0"
description = "MCP server exposing kbase's hybrid RAG (search, document/equation lookup) to OpenHands."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "kbase",
    "pydantic>=2.7",
    "mcp[cli]>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
kbase-mcp = "kbase_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbase_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
kbase = { workspace = true }
