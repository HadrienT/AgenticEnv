[project]
name = "cppdev"
version = "0.1.0"
description = "C++ toolchain for the agent: build, test, sanitize, analyze, condensed diagnostics."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "pydantic>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cppdev"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
