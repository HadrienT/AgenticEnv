[project]
name = "qmharness-mcp"
version = "0.1.0"
description = "MCP server exposing qmharness's numerical non-regression tools to OpenHands."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "qmharness",
    "pydantic>=2.7",
    "mcp[cli]>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
qmharness-mcp = "qmharness_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmharness_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
qmharness = { workspace = true }
