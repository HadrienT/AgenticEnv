[project]
name = "openhands-bridge"
version = "0.1.0"
description = "WebSocket bridge exposing openhands_adapter.AgentSession (streaming) to an external chat client, e.g. a VS Code extension. See blueprint/wp/WP08b-openhands-sandbox.md and the agenticenv-chat project."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "openhands-adapter",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "websockets>=13.0",
]

[project.scripts]
openhands-bridge = "openhands_bridge.server:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhands_bridge"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
openhands-adapter = { workspace = true }
