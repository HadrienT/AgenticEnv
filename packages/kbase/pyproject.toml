[project]
name = "kbase"
version = "0.1.0"
description = "Document ingestion pipeline and RAG schemas for the local quant knowledge base."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
kbase = "kbase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbase"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
