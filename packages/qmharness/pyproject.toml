[project]
name = "qmharness"
version = "0.1.0"
description = "Numerical non-regression harness driving quant-modeling's existing pybind11 bindings."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
qm = "qmharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmharness"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
