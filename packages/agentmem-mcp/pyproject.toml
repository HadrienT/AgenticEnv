[project]
name = "agentmem-mcp"
version = "0.1.0"
description = "MCP server exposing agentmem's episodic recall/remember and procedural lookup to OpenHands."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "agentmem",
    "pydantic>=2.7",
    "mcp[cli]>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
agentmem-mcp = "agentmem_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmem_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
agentmem = { workspace = true }
