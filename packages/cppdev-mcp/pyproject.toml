[project]
name = "cppdev-mcp"
version = "0.1.0"
description = "MCP server exposing cppdev's build/test/analyze tools to OpenHands."
requires-python = ">=3.12"
dependencies = [
    "corelib",
    "cppdev",
    "pydantic>=2.7",
    "mcp[cli]>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
cppdev-mcp = "cppdev_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cppdev_mcp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
corelib = { workspace = true }
cppdev = { workspace = true }
