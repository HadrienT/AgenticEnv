# WP21 wave 2: what wave 1 left out (blueprint/wp/WP21 §5).
# - UK assimilated law on legislation.gov.uk: EMIR margin and prudent valuation
#   standards, CVA until the PRA Basel 3.1 part applies (2027-01-01);
# - the BCBS/IOSCO margin framework (PDF, read by MinerU at ingestion);
# - credit risk on the counterparty side: EU CRR, PRA Basel 3.1 parts, 12 CFR 217;
# - proposals, not in force: the US re-proposal of 2026-03-19 (regulatory text of
#   subparts E and F) and the PRA's draft IMA rules of CP9/26.
#
#   uv run kbase harvest-regulation --catalog configs/harvest/regulation-wave2.yaml
#   uv run kbase regulation-formulas
#   uv run kbase ingest --target documents/manifest-regulation-<jurisdiction>.yaml
#
# Identifiers checked on 2026-11-13.

