# Second arXiv wave for quant-modeling: implementation performance (SIMD, CUDA, memory,
# AAD tooling, floating point) and the numerical gaps left by the first wave (Andersen QE,
# Rannacher smoothing). Performance work is mostly published outside q-fin, so these
# queries reach into cs.* on purpose; each is anchored on a technique a pricing library
# uses, to keep unrelated physics or ML out.
#
#   uv run kbase harvest --profile configs/harvest/performance.yaml --dry-run --summary
#   uv run kbase harvest --profile configs/harvest/performance.yaml
#   uv run kbase ingest --target documents/manifest-arxiv.yaml
name: performance
date_from: 2008-01-01
sort_by: relevance
queries:
  # --- Numerical gaps from wave 1 ---
  - topic: volatility-heston
    query: '(abs:"quadratic exponential" OR abs:"QE scheme" OR abs:"Broadie-Kaya" OR (abs:"exact simulation" AND abs:Heston)) AND (abs:Heston OR abs:"stochastic volatility" OR abs:CIR)'
    max_results: 25
  - topic: numerical-pde
    query: '(abs:Rannacher OR (abs:"Crank-Nicolson" AND (abs:oscillations OR abs:smoothing OR abs:nonsmooth OR abs:"non-smooth"))) AND (abs:option OR abs:payoff OR abs:"Black-Scholes")'
    max_results: 25
  # --- CPU: SIMD, memory, performance engineering ---
  - topic: performance-simd
    query: '(abs:SIMD OR abs:vectorization OR abs:vectorized OR abs:AVX OR abs:"AVX-512") AND (abs:"Monte Carlo" OR abs:"random number" OR abs:option OR abs:"finite difference" OR abs:stencil OR abs:"automatic differentiation" OR abs:"elementary functions" OR abs:"special functions")'
    max_results: 40
  - topic: performance-cpu
    query: '(abs:"data layout" OR abs:"structure of arrays" OR abs:"array of structures" OR abs:"cache-aware" OR abs:"cache-oblivious" OR abs:roofline) AND (cat:cs.PF OR cat:cs.MS OR cat:cs.DC)'
    max_results: 30
  - topic: performance-cpp
    query: '(abs:"expression templates" OR abs:"template metaprogramming" OR (abs:"C++" AND abs:"zero-cost")) AND (abs:performance OR abs:"automatic differentiation" OR abs:"linear algebra" OR abs:numerical)'
    max_results: 25
  # --- GPU ---
  - topic: performance-cuda
    query: '(abs:CUDA OR abs:GPU) AND (abs:"Monte Carlo" OR abs:"option pricing" OR abs:"path simulation" OR abs:"stochastic differential") AND (cat:cs.DC OR cat:cs.MS OR cat:cs.PF OR cat:q-fin.CP OR cat:math.NA)'
    max_results: 40
  - topic: performance-cuda
    query: '(abs:tridiagonal OR abs:"batched") AND (abs:GPU OR abs:CUDA OR abs:SIMD) AND (abs:solver OR abs:solve)'
    max_results: 25
  # --- Building blocks shared by every pricer ---
  - topic: numerical-aad
    query: '(abs:"operator overloading" OR abs:tape OR abs:"source transformation" OR abs:checkpointing) AND (abs:"automatic differentiation" OR abs:"algorithmic differentiation" OR abs:adjoint) AND (abs:performance OR abs:memory OR abs:"C++")'
    max_results: 30
  - topic: performance-numerics
    query: '(abs:erfinv OR abs:"inverse cumulative" OR abs:"inverse normal" OR abs:"normal quantile" OR abs:"cumulative normal") AND (abs:GPU OR abs:approximation OR abs:SIMD OR abs:fast OR abs:accurate)'
    max_results: 25
  - topic: performance-numerics
    query: '(abs:"mixed precision" OR abs:"half precision" OR abs:"reduced precision" OR abs:"single precision") AND (abs:"Monte Carlo" OR abs:finance OR abs:option OR abs:"stochastic differential")'
    max_results: 25
  - topic: performance-numerics
    query: 'abs:"compensated summation" OR abs:"Kahan summation" OR abs:"reproducible summation" OR (abs:"floating-point" AND abs:"reproducibility" AND abs:parallel)'
    max_results: 20
