# kbase v2 (WP19): curated books, section chunking with equations inline, bge-m3 with
# CLS pooling, a contextual cross-encoder over 100 candidates, per-document diversity.
# Measured in blueprint/wp/WP19-rag-v2.md §8. Needs the WP19 embed/rerank servers
# (infra/scripts/run-embed-server.sh) and a corpus ingested with this file.
embeddings:
  provider: http
  base_url: http://127.0.0.1:8310/v1
  model_name: bge-m3
  model_version: "q8_0-cls"      # CLS pooling: what bge-m3 is trained for (mean was wrong)
  dim: 1024                      # MUST match the vector(D) migration
  batch_size: 16
  normalize: true
  timeout_s: 300
  # Content alone: a "title / section path" header made the chunks of one book look
  # alike and cost 2 points of passage recall before reranking (WP19 §8).
  contextual: false
  query_instruction: null
  # Worst case ~2 characters per token (numeric tables): stays under the 4096-token batch.
  max_input_chars: 8000

chunking:
  strategy: section
  target_tokens: 400             # model tokens (~4 chars each), not words
  max_tokens: 700
  min_tokens: 120                # a smaller chunk absorbs its next sibling section
  overlap_tokens: 50
  keep_equation_with_context: true
  never_split_within: [equation, table]

retrieval:
  default_k: 8
  candidates_vector: 100
  candidates_lexical: 100
  fusion: rrf
  rrf_k: 60
  rerank:
    provider: http
    base_url: http://127.0.0.1:8311/v1
    model_name: bge-reranker-v2-m3
    top_k: 8
    candidates: 100              # fused candidates the cross-encoder reorders
    contextual: true             # the cross-encoder reads title / section path / content
    max_document_chars: 8000
    timeout_s: 300
  fts_config: simple             # no stemming: keeps SABR, SOFR, CVA intact
  lexical_fallback: true
  min_score: 0.0
  max_chunks_per_document: 3
  hnsw_ef_search: 200
  # pgvector >= 0.8 (WP20 §3.2): a filtered search keeps scanning until it has enough
  # rows. On 0.7.4 it is skipped and results carry a warning.
  hnsw_iterative_scan: relaxed_order
  hnsw_max_scan_tuples: 20000

collections:
  quant:
    description: >-
      derivatives pricing and its numerical methods: stochastic and rough volatility,
      Monte Carlo/QMC, PDE, Fourier, AAD, calibration, XVA pricing, C++/CUDA performance
  regulation:
    description: >-
      prudential regulation and supervisory texts, by jurisdiction (see below): capital
      rules for market risk (FRTB), counterparty credit risk (SA-CCR, IMM), CVA, credit
      risk, margin, liquidity, model risk

# What each jurisdiction holds in the regulation collection (WP21 §3). The agent reads
# this in the kb.search description: update it with every ingestion wave.
jurisdictions:
  intl:
    description: >-
      Basel Framework (BCBS), consolidated, all standards: CAP, RBC, CRE (credit risk,
      SA-CCR, IMM), MAR (FRTB, CVA), MGN (margin), LEV, LCR, NSF, LEX, SRP, DIS, OPE,
      SCO, BCP. International standards, not binding by themselves
  eu:
    description: >-
      ECB guide to internal models (guidance). EU binding rules (CRR, EBA RTS) not
      ingested yet
  us:
    description: >-
      Federal Reserve SR 26-2 model risk guidance (SR 11-7 kept for history). US binding
      rules (12 CFR) not ingested yet
  uk:
    description: >-
      PRA SS1/23 model risk principles (guidance). PRA Rulebook not ingested yet

curation:
  # Whole-title regexes (case-insensitive), matched once a leading "12.8" is removed.
  drop_sections:
    - '(table of )?contents'
    - 'front matter'
    - 'preface( to the .*)?'
    - 'foreword'
    - 'dedication'
    - 'acknowledge?ments?'
    - 'about the authors?'
    - '(subject |author |name )?index'
    - 'bibliography'
    - 'references?'
    - 'further reading'
    - 'bibliographic notes'
    - '(practice |further |review |end of chapter |end-of-chapter )?(questions|problems|exercises)( and problems)?'
    - 'exercises?'
    - 'problems?'
    - 'solutions?( to .*)?'
    - 'list of (figures|tables|symbols|abbreviations)'
    - 'copyright.*'
    - 'new to this edition'
    - 'solving teaching and learning challenges'
    - 'designing a course'
    - 'slides'
    - 'software'
    - 'employability'
    - 'math knowledge'
    - 'notices?'
    - 'trademarks?'
    - '(document )?revision history'
    - 'legal (notices?|information|disclaimer)'

provenance:
  require_page: false
  require_section: true

ingestion:
  max_file_size_mb: 50
  parse_timeout_s: 120
