# Model registry — single source of truth for the served LLM and its context size.
# Changing model/context = edit this file + `infra/scripts/render-llama-env.sh`
# (+ the install line it prints) + `just llm-use <profile>`. Never edit code to
# change these values.

# Profiles (issue #16): ONE model loaded at a time, picked by activity. Each
# profile renders to /etc/llm/profiles/<profile>.env; `just llm-use <profile>`
# points /etc/llm/llama-server.env at it and restarts llama-server.
# `served_name` is what clients see in /v1/models and must stay stable per
# profile: OpenHands and quant-modeling reference it, never the GGUF.
#   code      -> OpenHands agent (bridge + agenticenv-chat), quant-modeling assistant
#   translate -> live-subs (JA -> EN). Model chosen by live-subs' lot 06 bench,
#                then added here by a PR (models entry + `translate: <key>`).
default_profile: code
profiles:
  code: qwen3-coder-30b-a3b-q4

defaults:
  host: 127.0.0.1
  port: 8000
  split_mode: layer        # never "tensor" without a prior benchmark
  n_gpu_layers: all
  flash_attn: on
  cont_batching: true
  no_cpu_offload: true     # guard: refuse to start if CPU offload would be required

# ctx_size values that passed infra/scripts/bench-context.sh. render-llama-env.sh
# refuses any ctx_size not listed here. 32768 is the mandated bootstrap default.
# A model entry may carry its own `validated_ctx_sizes`, which then replaces
# this list for that model (e.g. a translation model benched at 8192 only).
validated_ctx_sizes:
  - 8192
  - 16384
  - 32768
  - 65536

models:
  qwen3-coder-30b-a3b-q4:
    path: /opt/llm/models/qwen3-coder-30b-a3b-instruct-q4_k_m.gguf
    sha256: fadc3e5f8d42bf7e894a785b05082e47daee4df26680389817e2093056f088ad
    served_name: Qwen3-Coder-30B-A3B-Instruct
    ctx_size: 65536
    approx_weights_gib: 17.5      # must stay <= limits.vram_budget_gib
    chat_template: null           # null = template embedded in the GGUF
    extra_args: []

limits:
  vram_budget_gib: 20             # locked decision, do not raise without validation
  vram_total_gib: 32
  reserve_for_kv_and_buffers_gib: 10
