# codeintel tuning (WP03). Read via `corelib.config.load_yaml_config("codeintel.yaml", ...)`
# from codeintel_mcp/tools/registry_matrix.py, then passed into codeintel.registry_matrix()
# as explicit keyword arguments — the core `codeintel` package never reads YAML itself
# (06-CONFIG.md: config loading only happens outside the pure business-logic layer).

registry_matrix:
  # What registers an (instrument, model, engine) triplet in `quant-modeling`'s
  # `PricingRegistry` (src/pricers/registry.cpp), and which enum gives which part of
  # the key: `r.register_pricer({InstrumentKind::X, ModelKind::Y, EngineKind::Z}, fn)`.
  function_names:
    - register_pricer
  key_enums:
    InstrumentKind: instrument
    ModelKind: model
    EngineKind: engine
