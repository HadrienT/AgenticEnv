role: plan
description: Lit le code et la documentation, propose un plan vérifiable, ne modifie rien.
system_prompt: agents/prompts/system-common.md + agents/prompts/snippets/plan.md

mcp_tools:                      # allowlist stricte
  - kb.search
  - kb.get_document
  - kb.get_equation
  - mem.recall
  - mem.list_procedures
  - mem.get_procedure
  - code.find_symbol
  - code.definition
  - code.references
  - code.outline
  - code.grep

permissions:
  filesystem: {read: true, write: false, delete: false}
  terminal:   {execute: true}    # to read the repo: the copy is disposable anyway

limits:
  max_iterations: 40
  timeout_seconds: 900
