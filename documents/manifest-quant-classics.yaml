# Classic papers quant-modeling relies on that are not on arXiv (issue #79). Paths are
# relative to AGX_PATHS_DOCUMENTS_DIR (host: /srv/knowledge/documents); the PDFs are not in
# the repo. Each is a copy its authors or an academic repository publish openly (author
# page, institutional repository, working-paper series); `license` says which. Kept local,
# not redistributed. Parsed through MinerU (PdfParser).
#
#   uv run kbase ingest --target documents/manifest-quant-classics.yaml

