# Option-data good practice for quant-modeling's WP 31 (clean option data at ingestion,
# lot L0 literature review; issue #82): exchange methodology, implied-vol computation,
# sample filters and the variance-swap replication. None of these is on arXiv (the one
# that is, Burkovska et al., comes through configs/harvest/quant-modeling-wave5.yaml).
# Paths are relative to AGX_PATHS_DOCUMENTS_DIR (host: /srv/knowledge/documents); the PDFs
# are not in the repo. Each is a copy its authors, an exchange or an academic repository
# publish openly; `license` says which. Kept local, not redistributed. Parsed through
# MinerU (PdfParser).
#
#   uv run kbase ingest --target documents/manifest-quant-option-data.yaml

collection: quant

documents:
  # --- Market methodology ---
  - doc_key: cboe-vix-mathematics-methodology
    path: classics/cboe-vix-mathematics-methodology.pdf
    title: Cboe Volatility Index Mathematics Methodology
    authors: [Cboe Global Indices]
    year: 2026
    doc_type: documentation
    topic: options-market-data
    source_url: https://cdn.cboe.com/resources/indices/Cboe_Volatility_Index_Mathematics_Methodology.pdf
    license: Cboe public methodology document (the VIX White Paper's successor; strike selection, mid quotes, the two-consecutive-zero-bid stop, forward from parity); local copy, not redistributed

  - doc_key: cboe-vix-index-methodology
    path: classics/cboe-vix-index-methodology.pdf
    title: Volatility Index Methodology, Cboe Volatility Index
    authors: [Cboe Global Indices]
    year: 2025
    doc_type: documentation
    topic: options-market-data
    source_url: https://cdn.cboe.com/resources/indices/Volatility_Index_Methodology_Cboe_Volatility_Index.pdf
    license: Cboe public governance document (as of September 2025); local copy, not redistributed

  # --- Implied vol computation ---
  - doc_key: jaeckel-2015-lets-be-rational
    path: classics/jaeckel-2015-lets-be-rational.pdf
    title: Let's Be Rational
    authors: [Peter Jäckel]
    year: 2015
    doc_type: research_paper
    topic: volatility-implied
    source_url: http://www.jaeckel.org/LetsBeRational.pdf
    license: author's copy, version of 25 March 2016 (Wilmott, January 2015); local copy, not redistributed

  # --- Sample filters ---
